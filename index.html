<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Test Sayfası</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Sayfa Hazır</h1>
  <p>Etkileşimi test etmek için butona bas.</p>
  <button id="testBtn">Test Et</button>

  <script>
    document.getElementById("testBtn").addEventListener("click", () => {
      alert("Buton çalıştı!");
    });
  </script>
</body>
</html>
